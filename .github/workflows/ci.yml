name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/main"
      # Os projetos de e2e ainda são o exemplo gerado pelo Nx (sem testes
      # reais, sem banco nem navegadores no CI), então ficam de fora até
      # ganharem testes de verdade.
      - run: npx nx run-many -t lint test build typecheck --exclude=@dili/api-e2e,@dili/web-e2e
